<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Sign in</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<main class="auth">
    <div class="auth-box">
        <a class="brand" href="/login"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 0c2.5 2.7 3.8 6.1 3.8 10S14.5 19.3 12 22m0-20C9.5 4.7 8.2 8.1 8.2 12s1.3 7.3 3.8 10M2.5 9h19M2.5 15h19"/></svg></span><span data-portal-title>Web Portal</span></a>
        <div class="panel"><div class="panel-body">
            <h1>Sign in</h1>
            <p class="lead">Use your account, or the access code from your administrator.</p>

            <!-- Messages passed in the URL (?signedout=1, ?registered=1) -->
            <div id="notice" class="alert success hidden" role="status"></div>

            <div class="tabs" role="tablist" aria-label="Sign-in method">
                <button type="button" class="active" role="tab" aria-selected="true" data-mode="password">Username</button>
                <button type="button" role="tab" aria-selected="false" data-mode="token">Access code</button>
            </div>

            <form id="login-form" autocomplete="on" novalidate>
                <div id="error" class="alert error hidden" role="alert"></div>
                <div data-for="password">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input id="password" name="password" type="password" autocomplete="current-password" required>
                            <button type="button" class="reveal" aria-label="Show password" aria-pressed="false">Show</button>
                        </div>
                    </div>
                </div>
                <div data-for="token" class="hidden">
                    <div class="field">
                        <label for="token">Access code</label>
                        <div class="input-wrap">
                            <input id="token" name="token" type="password" autocomplete="one-time-code" autocapitalize="none" autocorrect="off" spellcheck="false">
                            <button type="button" class="reveal" aria-label="Show code" aria-pressed="false">Show</button>
                        </div>
                    </div>
                </div>
                <button type="submit" class="primary block" id="submit">Sign in</button>
            </form>
        </div></div>
        <p class="auth-foot hidden" id="register-link">No account yet? <a href="/register">Create an account</a></p>
    </div>
</main>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
