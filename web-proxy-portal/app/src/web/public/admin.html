<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Admin</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="logo" href="/admin"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span>Admin</span></a>
    <span class="badge plain hide-mobile" id="release"></span>
    <span class="spacer"></span>
    <a href="/" class="btn small">Back to portal</a>
    <button type="button" class="small" id="logout">Sign out</button>
</header>

<nav class="tabs admin-tabs" id="tabs">
    <button type="button" data-tab="dashboard" class="active">Dashboard</button>
    <button type="button" data-tab="users">Users <span class="count hidden" id="pending-count"></span></button>
    <button type="button" data-tab="pools">Proxy pools</button>
    <button type="button" data-tab="sites">Sites</button>
    <button type="button" data-tab="scripts">Scripts</button>
    <button type="button" data-tab="sessions">Sessions</button>
    <button type="button" data-tab="errors">Errors <span class="count hidden" id="error-count"></span></button>
    <button type="button" data-tab="logs">Activity log</button>
    <button type="button" data-tab="settings">Settings</button>
</nav>

<!-- Each tab is rendered into #view by admin.js -->
<main class="container" id="view" aria-live="polite"></main>

<!-- Modal used for create/edit forms -->
<div class="modal-backdrop hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="card-title"><h2 id="modal-title"></h2><span class="spacer"></span><button type="button" class="link" id="modal-close">Close</button></div>
        <div id="modal-error" class="alert error hidden"></div>
        <div id="modal-body"></div>
    </div>
</div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
