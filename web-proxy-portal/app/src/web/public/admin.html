<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Admin</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="admin">
    <!-- Sidebar: grouped navigation (becomes a scrollable tab row on phones) -->
    <aside class="sidebar" aria-label="Admin navigation">
        <a class="brand" href="/admin"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg></span><span>Admin</span></a>
        <nav id="tabs">
            <div class="nav-group"><span>Overview</span>
                <button type="button" data-tab="dashboard">Dashboard</button>
            </div>
            <div class="nav-group"><span>People</span>
                <button type="button" data-tab="users">Users <span class="count hidden" id="pending-count"></span></button>
            </div>
            <div class="nav-group"><span>Proxies</span>
                <button type="button" data-tab="pools">Proxy pools</button>
                <button type="button" data-tab="sessions">Sessions</button>
            </div>
            <div class="nav-group"><span>Content</span>
                <button type="button" data-tab="sites">Sites</button>
                <button type="button" data-tab="scripts">Scripts</button>
            </div>
            <div class="nav-group"><span>Monitoring</span>
                <button type="button" data-tab="requests">Requests</button>
                <button type="button" data-tab="errors">Errors <span class="count hidden" id="error-count"></span></button>
                <button type="button" data-tab="server">Server</button>
                <button type="button" data-tab="logs">Activity log</button>
            </div>
            <div class="nav-group"><span>System</span>
                <button type="button" data-tab="settings">Settings</button>
            </div>
        </nav>
        <div class="sidebar-foot">
            <a href="/">Back to portal</a>
            <button type="button" id="logout">Sign out</button>
            <div class="release" id="release" title="Running release"></div>
        </div>
    </aside>

    <!-- Each section is rendered into #view by admin.js -->
    <main class="admin-main" id="view" tabindex="-1" aria-live="polite"></main>
</div>

<!-- Side panel for forms and details (keeps the list visible behind it) -->
<div class="drawer-backdrop hidden" id="modal">
    <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="drawer-head"><h2 id="modal-title"></h2><button type="button" class="ghost small" id="modal-close" aria-label="Close panel">Close</button></div>
        <div id="modal-error" class="alert error hidden" role="alert"></div>
        <div id="modal-body" class="drawer-content"></div>
    </div>
</div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
