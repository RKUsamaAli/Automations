<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Web Portal</title>
    <meta name="theme-color" content="#f6f7f9">
    <script src="/assets/js/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="home-body">
<!-- Top bar is added by Portal.shell(); the proxy chip goes into its .page-actions -->
<template id="conn-template">
    <div class="menu-wrap conn-wrap">
        <button type="button" class="conn-chip" id="conn-chip" aria-haspopup="dialog" aria-expanded="false" aria-controls="conn-panel">
            <span class="dot" id="conn-dot"></span><span class="conn-text" id="conn-line">No proxy</span><svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu conn-panel" id="conn-panel" role="dialog" aria-label="Connection" hidden>
            <label class="switch-row"><span><strong>Use a proxy</strong><span class="hint" id="proxy-hint">Off: websites see the server's own connection.</span></span>
                <input type="checkbox" role="switch" id="proxy-on"></label>
            <div class="via hidden" id="via">
                <label for="pool" class="field-label">Connect through</label>
                <select id="pool" aria-describedby="pool-health"></select>
                <div class="hint" id="pool-health" aria-live="polite"></div>
            </div>
            <a class="small" href="/sessions">Open sessions and their proxies →</a>
        </div>
    </div>
</template>
<main class="home" id="main">
    <div class="home-center">
        <h1 class="home-brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span id="start-title">Web Portal</span></h1>
        <form id="go-form" class="start-search" role="search" novalidate>
            <svg class="start-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <label for="url" class="sr-only">Search or type a web address</label>
            <input id="url" type="search" enterkeyhint="go" placeholder="Search or type a web address" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
            <button type="submit" class="primary" id="go">Go</button>
        </form>
        <div id="go-error" class="alert error hidden" role="alert"></div>
        <div id="notice" class="alert info hidden" role="status"></div>
        <section class="recent hidden" id="recent" aria-labelledby="recent-title">
            <div class="recent-head"><h2 id="recent-title">Recent searches</h2><button type="button" class="link small" id="recent-clear">Clear</button></div>
            <ul class="recent-list" id="recent-list"></ul>
        </section>
        <section class="hidden start-sites" id="sites-card" aria-label="Your sites">
            <ul class="tiles" id="sites"></ul>
        </section>
    </div>
</main>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/portal.js"></script>
</body>
</html>
