<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Browse</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<!-- Top bar + phone tab bar are added by Portal.shell() -->
<main class="container">
    <div class="page-head">
        <div class="titles">
            <h1>Browse</h1>
            <p>Open a website through a proxy. A session keeps the site's logins until you end it.</p>
        </div>
    </div>

    <div id="notice" class="alert info hidden" role="status"></div>

    <!-- Address bar -->
    <section class="panel" aria-label="Open a website"><div class="panel-body">
        <form id="go-form" class="open-form" novalidate>
            <div>
                <label for="url" class="sr-only">Website address</label>
                <input id="url" type="url" inputmode="url" enterkeyhint="go" placeholder="Website address, e.g. example.com" autocapitalize="none" autocorrect="off" spellcheck="false">
            </div>
            <div class="via" id="via">
                <label for="pool" class="sr-only">Connect through</label>
                <select id="pool" aria-describedby="pool-health"></select>
            </div>
            <button type="submit" class="primary" id="go">Open</button>
        </form>
        <div class="hint" id="pool-health" aria-live="polite"></div>
        <div id="go-error" class="alert error hidden" role="alert"></div>
    </div></section>

    <div class="grid main-side">
        <!-- Active sessions (the main task: continue where you left off) -->
        <section class="panel" aria-labelledby="sessions-title">
            <div class="panel-head"><h2 id="sessions-title">Sessions <span class="muted" id="session-count"></span></h2><button type="button" class="small" id="refresh">Refresh</button></div>
            <ul class="rows" id="sessions"></ul>
        </section>
        <!-- Admin-configured sites -->
        <section class="panel hidden" id="sites-card" aria-labelledby="sites-title">
            <div class="panel-head"><h2 id="sites-title">Quick access</h2></div>
            <ul class="rows" id="sites"></ul>
        </section>
    </div>
</main>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/portal.js"></script>
</body>
</html>
