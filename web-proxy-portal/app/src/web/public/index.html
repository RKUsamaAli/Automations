<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Portal</title>
    <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<header class="topbar">
    <span class="brand" id="brand">Portal</span>
    <span class="spacer"></span>
    <a href="/admin" id="admin-link" class="btn small hidden">Admin</a>
    <button type="button" class="small" id="logout">Sign out</button>
</header>

<main class="container">
    <div id="notice" class="alert info hidden"></div>

    <!-- URL bar -->
    <section class="card">
        <h2>Open a website</h2>
        <form id="go-form" class="go-form" novalidate>
            <input id="url" type="url" inputmode="url" placeholder="example.com" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Website address">
            <button type="submit" class="primary" id="go">Go</button>
        </form>
        <div id="go-error" class="alert error hidden" role="alert"></div>
    </section>

    <!-- Admin-configured sites -->
    <section class="card hidden" id="sites-card">
        <h2>Sites</h2>
        <div class="tiles" id="sites"></div>
    </section>

    <!-- Active sessions -->
    <section class="card">
        <div class="card-title"><h2>Your sessions</h2><span class="spacer"></span><button type="button" class="small" id="refresh">Refresh</button></div>
        <p class="muted small">A session keeps the site's cookies and logins. Resume it to continue where you left off.</p>
        <ul class="list" id="sessions"></ul>
    </section>
</main>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/portal.js"></script>
</body>
</html>
