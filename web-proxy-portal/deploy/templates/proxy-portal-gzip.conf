# /etc/nginx/snippets/proxy-portal-gzip.conf  -  installed by setup-server.sh
# Compresses text responses (HTML, CSS, JS, JSON, SVG): 70-85 % smaller on the
# wire, much faster page loads on mobile networks. Set per site (not in the
# http block) so it never clashes with Ubuntu's default "gzip on;".
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;
