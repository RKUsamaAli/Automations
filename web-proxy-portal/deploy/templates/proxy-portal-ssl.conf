# /etc/nginx/snippets/proxy-portal-ssl.conf  -  installed by setup-server.sh
# Modern TLS settings that iOS Safari and current desktop browsers support.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:pp_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
