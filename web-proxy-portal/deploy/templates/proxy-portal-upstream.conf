# /etc/nginx/snippets/proxy-portal-upstream.conf  -  installed by setup-server.sh
# Common settings for every location that forwards to the Node.js processes.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;   # the app trusts this (127.0.0.1 only)
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id      $request_id;     # same id in nginx logs, app logs and error reports

# WebSockets (many sites use them; hammerhead proxies them)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $pp_connection_upgrade;

# Long-running requests (big downloads, long polling, websockets)
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# Stream responses/uploads instead of buffering them on disk
proxy_buffering         off;
proxy_request_buffering off;
